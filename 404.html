<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>没有这一页 · 搬家甩卖</title>
<style>
:root{--kraft:#D5BA8E;--label:#F6F0E3;--ink:#221E19;--ink-soft:#6E6357;--marker:#BE352B}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--kraft);color:var(--ink);padding:24px;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif}
.card{background:var(--label);border-radius:5px;padding:40px 32px;max-width:380px;width:100%;
  text-align:center;box-shadow:0 2px 12px rgba(34,30,25,.18)}
h1{font-family:"Songti SC","STSong","Noto Serif SC",Georgia,serif;
  font-size:30px;font-weight:700;letter-spacing:.06em;margin:0 0 10px}
p{margin:0 0 22px;color:var(--ink-soft);font-size:14px;line-height:1.6}
a{display:inline-block;background:var(--marker);color:var(--label);text-decoration:none;
  padding:9px 22px;border-radius:5px;font-size:14px}
</style>
</head>
<body>
<div class="card">
  <h1>没有这一页</h1>
  <p>东西可能已经出掉了，<br>也可能是地址敲错了。</p>
  <a href="/">回甩卖现场</a>
</div>
</body>
</html>
